<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="64" height="64" rx="16" stroke="#334155" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Energy Well Landscape Path Fill -->
  <path d="M 8 46 Q 16 22, 24 44 T 40 24 T 56 46 V 54 H 8 Z" fill="url(#glowGrad)" />

  <!-- Double Well / Metadynamics Wave Line -->
  <path d="M 8 44 C 14 20, 18 16, 25 42 C 30 52, 35 14, 42 22 C 48 28, 52 44, 56 44" 
        stroke="url(#waveGrad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Deposition hill dots -->
  <circle cx="25" cy="42" r="2.5" fill="#38bdf8" />
  <circle cx="42" cy="22" r="2.5" fill="#f59e0b" />
  <circle cx="34" cy="18" r="2" fill="#a855f7" />
</svg>
